<!DOCTYPE html>
<html lang="$default_profile" data-profile="$default_profile" data-tz="$timezone" data-root="$root_attr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>$page_title</title>
<meta name="description" content="$page_description">
<link rel="icon" href="$root/css/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="$root/manifest.webmanifest">
<link rel="apple-touch-icon" href="$root/css/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="$app_name">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f2ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#13151b" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="$root/css/style.css?v=$version">
<style>$profile_css</style>
<script>
window.FRKH_PROFILES = $profiles_json;
window.FRKH_LANGS = $langs_json;
(function () {
  var root = document.documentElement, profile = null, legacy = { A: "km", B: "fr" };
  root.classList.add("js");
  try {
    /* Anciens profils (A : khmer, B : français) : la progression est reprise sous les nouveaux noms. */
    if (!localStorage.getItem("frkh-migrated-profiles")) {
      var keys = [];
      for (var i = 0; i < localStorage.length; i++) { keys.push(localStorage.key(i)); }
      keys.forEach(function (key) {
        var m = /^(frkh-(?:done2|done|days|quiz|review|boxes))-([AB])(-(?:fr|en|km))?$$/.exec(key || "");
        if (!m) { return; }
        var target = m[1] + "-" + legacy[m[2]] + (m[3] || "");
        if (localStorage.getItem(target) === null) { localStorage.setItem(target, localStorage.getItem(key)); }
      });
      var old = localStorage.getItem("frkh-profile");
      if (legacy[old]) { localStorage.setItem("frkh-profile", legacy[old]); }
      localStorage.setItem("frkh-migrated-profiles", "1");
    }
  } catch (e) {}
  try {
    var m = /(?:^|[#&])profil=([A-Za-z]+)/.exec(location.hash);
    profile = m ? m[1] : localStorage.getItem("frkh-profile");
  } catch (e) {}
  profile = legacy[profile] || profile;
  if (profile && window.FRKH_PROFILES[profile]) { root.setAttribute("data-profile", profile); }
  root.setAttribute("lang", root.getAttribute("data-profile"));
  /* Langues masquées par le sélecteur « Langues » (classes hide-xx posées avant l'affichage). */
  try {
    var langs = window.FRKH_LANGS, hidden = null, saved = localStorage.getItem("frkh-langs-hidden");
    if (saved !== null) { hidden = JSON.parse(saved); }
    if (!(hidden instanceof Array)) {
      hidden = langs.all.filter(function (l) { return langs.shown.indexOf(l) === -1; });
    }
    hidden.forEach(function (l) { if (langs.all.indexOf(l) !== -1) { root.classList.add("hide-" + l); } });
  } catch (e) {}
  try { var size = localStorage.getItem("frkh-size"); if (size === "l" || size === "xl") root.setAttribute("data-size", size); } catch (e) {}
})();
</script>
</head>
<body class="$body_class">
<a class="skip" href="#contenu">$ui_skip</a>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" data-nav href="$root/index.html" title="$site_title">
      <span class="brand-dots" aria-hidden="true"><i class="dot-fr"></i><i class="dot-en"></i><i class="dot-km"></i></span>
      <span class="brand-name"><span class="brand-full">$site_title</span><span class="brand-short">$app_name</span></span>
    </a>
    <nav class="mainnav" aria-label="$nav_label">$main_nav</nav>
    <div class="tools">
      <button type="button" class="tool tool-slow js-only" id="slow-toggle" aria-pressed="false" title="$ui_slow_title" aria-label="$ui_slow_title">$icon_gauge<span class="tool-slow-rate" id="slow-rate">1×</span></button>
      $settings
    </div>
  </div>
</header>
<main id="contenu" class="page">
$content
</main>
<nav class="tabbar" aria-label="$nav_label">$tab_nav</nav>
<footer class="footer">
  <p>$site_title — $ui_footer</p>
</footer>
<script src="$root/js/app.js?v=$version" defer></script>
</body>
</html>
