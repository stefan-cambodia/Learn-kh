<!DOCTYPE html>
<html lang="fr" data-profile="$default_profile" data-tz="$timezone" data-root="$root_attr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>$page_title</title>
<meta name="description" content="$page_description">
<link rel="icon" href="$root/css/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="$root/manifest.webmanifest">
<link rel="apple-touch-icon" href="$root/css/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="$app_name">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f5f2ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161c" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="$root/css/style.css?v=$version">
<script>
(function () {
  var root = document.documentElement, profile = null;
  root.classList.add("js");
  try {
    var m = /(?:^|[#&])profil=([AB])/.exec(location.hash);
    profile = m ? m[1] : localStorage.getItem("frkh-profile");
  } catch (e) {}
  if (profile === "A" || profile === "B") root.setAttribute("data-profile", profile);
  try { var size = localStorage.getItem("frkh-size"); if (size === "l" || size === "xl") root.setAttribute("data-size", size); } catch (e) {}
})();
</script>
</head>
<body class="$body_class">
<a class="skip" href="#contenu">$ui_skip</a>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" data-nav href="$root/index.html" title="$site_title">
      <span class="brand-dots" aria-hidden="true"><i class="dot-fr"></i><i class="dot-en"></i><i class="dot-km"></i></span>
      <span class="brand-name">$site_title</span>
    </a>
    <div class="tools">
      <a class="tool-link tool-review" data-nav href="$root/revision.html" title="Réviser" aria-label="Réviser"><span class="tool-link-glyph" aria-hidden="true">$icon_cards</span>$ui_review</a>
      <a class="tool-link tool-lexicon" data-nav href="$root/lexique.html" title="Lexique" aria-label="Lexique"><span class="tool-link-glyph" aria-hidden="true">$icon_book</span>$ui_lexicon</a>
      <a class="tool-link" data-nav href="$root/alphabet.html" title="Alphabets" aria-label="Alphabets"><span class="tool-link-glyph" aria-hidden="true" lang="km">ក</span>$ui_alphabet</a>
      <button type="button" class="tool-size js-only" id="size-toggle" title="$ui_size_title" aria-label="$ui_size_title"><span aria-hidden="true">A<small>A</small></span></button>
      <button type="button" class="tool-slow js-only" id="slow-toggle" aria-pressed="false">
        <span class="tool-slow-rate" aria-hidden="true">0,75×</span>$ui_slow
      </button>
      <div class="profile-switch js-only" role="group" aria-label="$ui_profile">
        <button type="button" data-profile-choice="A" aria-pressed="false">$name_a</button>
        <button type="button" data-profile-choice="B" aria-pressed="false">$name_b</button>
      </div>
    </div>
  </div>
</header>
<main id="contenu" class="page">
$content
</main>
<nav class="tabbar" aria-label="Navigation principale">
  <a class="tab tab-home" data-nav href="$root/index.html">$icon_house<span class="tab-label">$ui_home_short</span></a>
  <a class="tab tab-review" data-nav href="$root/revision.html">$icon_cards<span class="tab-label">$ui_review</span></a>
  <a class="tab tab-lexicon" data-nav href="$root/lexique.html">$icon_book<span class="tab-label">$ui_lexicon</span></a>
  <a class="tab tab-alphabet" data-nav href="$root/alphabet.html"><span class="tab-glyph" lang="km" aria-hidden="true">ក</span><span class="tab-label">$ui_alphabet_short</span></a>
</nav>
<footer class="footer">
  <p>$site_title — $ui_footer</p>
</footer>
<script src="$root/js/app.js?v=$version" defer></script>
</body>
</html>
